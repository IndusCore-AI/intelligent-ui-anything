name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent Skills spec (skills-ref, pinned to agentskills/agentskills f130f34)
        run: |
          python -m pip install --quiet "git+https://github.com/agentskills/agentskills@f130f348f502d9804278a617f86929846896d2e9#subdirectory=skills-ref"
          skills-ref validate "$GITHUB_WORKSPACE"
      - name: Floor check on every template
        run: node scripts/check --templates
      - name: Tests
        run: node tests/run
      - name: SKILL.md under 500 lines
        run: test "$(wc -l < SKILL.md)" -lt 500
      - name: No em or en dashes anywhere
        run: |
          if grep -rnP '\x{2013}|\x{2014}' --exclude-dir=.git .; then exit 1; fi
