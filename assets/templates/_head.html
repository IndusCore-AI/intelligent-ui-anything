{{^fragment}}<!doctype html>
<html lang="{{lang}}" data-finance="{{finance}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
{{/fragment}}<title>{{subject}}</title>
{{#fragment}}<meta name="claude:viewport-fit-sides" content="cover">
{{/fragment}}<meta name="description" content="{{description}}">
<meta name="iua-endpoint" content="">
<meta name="iua-version" content="">
<meta name="iua-live" content="{{liveSeconds}}">
<style>
{{{css}}}
</style>
<script>document.documentElement.classList.add('js');</script>
{{^fragment}}</head>
<body data-shape="{{shape}}">
{{/fragment}}<div class="page" lang="{{lang}}" data-finance="{{finance}}" data-shape="{{shape}}"{{#live}} data-intro="off"{{/live}}>
<svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L2.4 17.5a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></symbol>
  <symbol id="i-st-pass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M7.5 12.5l3 3 6-6.5" style="stroke: var(--color-raised)"/></symbol>
  <symbol id="i-st-fail" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" style="stroke: var(--color-raised)"/></symbol>
  <symbol id="i-st-warn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M12 7.5v5.5M12 16.5h.01" style="stroke: var(--color-raised)"/></symbol>
  <symbol id="i-st-running" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-st-waiting" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="3.2 3.2"/></symbol>
  <symbol id="i-st-skip" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></symbol>
</svg>
<header class="page-head">
  <div class="page-head-text">
    <h1>{{subject}}</h1>
    {{#question}}<p class="question">{{question}}</p>{{/question}}
    {{#summary}}<p class="summary">{{summary}}</p>{{/summary}}
  </div>
  {{^fragment}}<div class="theme-switch toggle-group" role="group" aria-label="Colour theme" hidden>
    <button type="button" data-theme-choice="auto" aria-pressed="true">Auto</button>
    <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
  </div>{{/fragment}}
</header>
<main id="main">
